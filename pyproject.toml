[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blianscham-lencomply"
version = "0.1.0"
description = "按字符、词数、段落数三个口径分别测量输出长度，给出与要求区间的偏差"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "blianscham" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://blianscham.github.io"
Repository = "https://github.com/blianscham/lencomply"
Issues = "https://github.com/blianscham/lencomply/issues"

[project.scripts]
lencomply = "lencomply:main"

[tool.setuptools]
py-modules = ["lencomply"]
